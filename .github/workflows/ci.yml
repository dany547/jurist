name: CI

# Tests + eval on every push and pull request. On main, when the version in
# pyproject.toml has no GitHub Release yet, publish one (tag vX.Y.Z + notes from
# the matching CHANGELOG.md section). Releasing = bump version + CHANGELOG, push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install "PyYAML>=6.0" pytest

      - name: SQLite has FTS5 with remove_diacritics 2
        run: |
          python - <<'EOF'
          import sqlite3
          print("SQLite", sqlite3.sqlite_version)
          sqlite3.connect(":memory:").execute(
              "CREATE VIRTUAL TABLE t USING fts5(x, tokenize='unicode61 remove_diacritics 2')")
          EOF

      - name: Release notes exist for the current version
        run: python scripts/release_info.py notes > /dev/null

      - name: Tests
        env:
          JURIST_SESSION: ci
        run: python -m pytest -q

      - name: Retrieval eval (recall@10 >= 0.9)
        env:
          JURIST_SESSION: ci
        run: |
          python scripts/eval_recall.py | tee eval.json
          python -c "import json,sys; d=json.load(open('eval.json')); sys.exit(0 if d['passed'] else 1)"

  release:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Publish release for the current version if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python3 scripts/release_info.py version)"
          TAG="v${VERSION}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          python3 scripts/release_info.py notes > notes.md
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG exists; creating the release on it."
            gh release create "$TAG" --title "jurist $VERSION" --notes-file notes.md --verify-tag
          else
            echo "Creating tag $TAG at $GITHUB_SHA and its release."
            gh release create "$TAG" --title "jurist $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
          fi
