candidate_decisions:
  - candidate: "Legea nr. 363/2007"
    decision: "include"
    justification: "Act român central pentru practicile comerciale incorecte; corespunde Directivei 2005/29/CE."
    official_links:
      - "https://legislatie.just.ro/Public/DetaliiDocument/88290"
      - "https://eur-lex.europa.eu/eli/dir/2005/29/oj"
  - candidate: "Directiva (UE) 2019/770"
    decision: "include"
    justification: "Regula UE de bază pentru contractele de furnizare de conținut și servicii digitale; are transpunere română în OUG 141/2021."
    official_links:
      - "https://eur-lex.europa.eu/eli/dir/2019/770/oj"
      - "https://legislatie.just.ro/Public/DetaliiDocument/250054"
  - candidate: "Directiva (UE) 2019/771"
    decision: "include"
    justification: "Regula UE de bază pentru vânzarea de bunuri; are transpunere română în OUG 140/2021."
    official_links:
      - "https://eur-lex.europa.eu/eli/dir/2019/771/oj"
      - "https://legislatie.just.ro/Public/DetaliiDocument/250044"
  - candidate: "Regulamentul (UE) 2018/302"
    decision: "include"
    justification: "Regulamentul direct aplicabil privind geoblocarea nejustificată în piața internă, relevant pentru magazine online."
    official_links:
      - "https://eur-lex.europa.eu/eli/reg/2018/302/oj"
  - candidate: "Regulamentul (UE) nr. 910/2014 (eIDAS)"
    decision: "include"
    justification: "Regulament direct aplicabil pentru identificare electronică, semnături și servicii de încredere folosite la contractarea online; amendamentul 2024/1183 rămâne roadmap."
    official_links:
      - "https://eur-lex.europa.eu/eli/reg/2014/910/oj"
  - candidate: "Directiva 2002/58/CE (ePrivacy)"
    decision: "include"
    justification: "Este încă reperul UE pentru confidențialitatea comunicațiilor și cookie-uri, dar aplicarea practică în România este prin Legea 506/2004; se cere decizie dacă v1 răspunde la nivel UE sau doar la transpunerea națională."
    official_links:
      - "https://eur-lex.europa.eu/eli/dir/2002/58/oj"
      - "https://legislatie.just.ro/Public/DetaliiDocument/56973"
  - candidate: "Regulamentul (UE) 2024/1183 (amendament eIDAS)"
    decision: "roadmap"
    justification: "Extinde cadrul eIDAS; se păstrează pentru o revizie v1.1 după stabilirea regulilor de versiuni și a datei de aplicare."
    official_links:
      - "https://eur-lex.europa.eu/eli/reg/2024/1183/oj"

