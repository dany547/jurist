[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jurist"
version = "0.1.8"
description = "Offline Romanian/EU legal retrieval MVP"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
jurist = "jurist.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
